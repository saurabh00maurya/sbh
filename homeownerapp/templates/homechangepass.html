{% extends 'homeownerbase.html' %}
{% load static %}

{% block homeowners %}
<div class="container-fluid">
    <div class="row">
        <div class="com-sm-8 mx-auto">
            <div class="card p-4">
                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="oldpwd" class="form-label">Old Password</label>
                        <input type="password" name="oldpwd" class="form-control" id="oldpwd" required>

                    </div>
                    <div class="mb-3">
                        <label for="newpwd" class="form-label">New Password</label>
                        <input type="password" name="newpwd" class="form-control" id="newpwd" required>

                    </div>
                    <div class="mb-3">
                        <label for="confirmpwd" class="form-label">Comfirm Password</label>
                        <input type="password" name="confirmpwd" class="form-control" id="confirmpwd" required>
                    </div>

                    <button type="submit" class="btn btn-primary">Change Password</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
