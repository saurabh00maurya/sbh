{% extends 'base.html' %}
{% load static %}

{% block main %}

<div class="row justify-content-center " style="padding-top: 80px; padding-bottom: 10px;" >
  <div class="col-md-4" >

    <div class="card p-4 border-0" style="background-color:#161b25; box-shadow:0 0 20px #161b25;">
      <h3 class="text-center mb-3">Login</h3>

      {% if messages %}
      {% for m in messages %}
      <div class="alert alert-success alert-dismissible fade show" role="alert">
        {{m}}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      {% endfor %}
      {% endif %}

      <form method="post">
        {% csrf_token %}

        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <input type="email" name="username" class="form-control" placeholder="Enter email" required>
        </div>

        <div class="mb-4">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" placeholder="Enter password" required>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-primary">Login</button>
        </div>

      </form>

    </div>

  </div>
</div>

{% endblock %}
